<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<div class="auth"><div class="atop"><a class="back" href="login.html"><i>←</i> Volver</a><button class="btn g" data-theme-toggle type="button"></button></div>
<div class="acard"><a class="brand" href="index.html">Tool<span>Board</span></a><h1>Crear cuenta</h1><p>Las cuentas nuevas se crean con rol de usuario.</p><div id="msg"></div>
<form id="regForm"><label>Nombre <input name="nombre" required></label><label>Apellido <input name="apellido" required></label>
<label>Usuario <input name="usuario" required minlength="3" maxlength="40" pattern="[A-Za-z0-9_.\-]+" autocomplete="username"></label>
<label>Contraseña <input type="password" id="clave" name="clave" required minlength="3" autocomplete="new-password"></label>
<label>Confirmar contraseña <input type="password" id="clave2" name="clave2" required autocomplete="new-password"></label>
<button class="btn">Registrarse</button></form><p class="alt">¿Ya tenés cuenta? <a href="login.html">Iniciar sesión</a></p></div></div>
<script src="config.js"></script><script src="script.js"></script><script src="app.js"></script></body></html>
